name: 'Setup Nix'
description: 'Set up Nix with the shared cache action'
inputs:
  github-token:
    description: Token for authenticated Nix GitHub fetches
    required: false
    default: ''
  extra-conf:
    description: Additional public Nix configuration; credentials must use github-token
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Ubuntu 24.04 runner images restrict unprivileged user-namespace creation
    # via AppArmor by default, which breaks bubblewrap-based sandboxing (e.g.
    # grok's Linux wrapper) invoked from within a Nix build.
    - name: Allow unprivileged user namespaces
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

    - name: Install Nix and configure the shared cache
      uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
      with:
        github-token: ${{ inputs.github-token || github.token }}
        extra-conf: |
          accept-flake-config = true
          ${{ inputs.extra-conf }}
