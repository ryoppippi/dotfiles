name: 'CI: Neovim plugins'

on:
  push:
    paths:
      - 'nvim/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/modules/home/programs/neovim/**'
      - '.github/workflows/nix-neovim.yaml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neovim-check:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-nix

      # nvimx's startup check: the wrapper a switch installs, started headless
      # and offline with the repository's nvim/, loading every store plugin.
      # A plugin that fails to build or errors on load fails here.
      - name: Start Neovim with the locked plugins
        run: nix build .#homeConfigurations.ryoppippi-aarch64.config.programs.nvimx.env.check --print-build-logs
