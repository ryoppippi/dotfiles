name: 'CI: Neovim plugins'

on:
  push:
    paths:
      - 'nvim/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/modules/home/programs/neovim/**'
      - '.github/workflows/nix-neovim.yaml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neovim-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-nix

      # The wrapper nvimx builds from nvim/nvimx-lock, i.e. exactly what a
      # switch installs, so a plugin that fails to build fails here.
      - name: Build Neovim with locked plugins
        run: nix build .#homeConfigurations.ryoppippi-aarch64.config.programs.nvimx.env.wrapped --out-link nvim-result

      # XDG_CONFIG_HOME points at the checkout so the repository's nvim/ is the
      # config under test. Only store-served plugins are loaded: `dev = true`
      # ones live in ~/ghq checkouts CI does not have. Plugins also report
      # progress on stderr, so only real errors fail the job. Replace with
      # nvimx's own startup check once myuron/nvimx#79 lands.
      - name: Start Neovim with the repository config
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}
        run: |
          ./nvim-result/bin/nvim --headless \
            -c 'lua local lazy = require("lazy"); local names = {}; for _, p in ipairs(lazy.plugins()) do if p._.installed then names[#names + 1] = p.name end end; lazy.load({ plugins = names })' \
            +qa 2> stderr.log
          cat stderr.log
          ! grep -E 'E[0-9]+:|Error|stack traceback' stderr.log
