name: 'Bot: Update Neovim plugins'

on:
  schedule:
    # An hour after the stable flake update, so the bots do not race for the
    # same checkout.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository (for local actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up git bot identity
        id: bot
        uses: ./.github/actions/setup-git-bot
        with:
          app-id: ${{ secrets.RYOPPIPPI_NIX_UPDATER_APP_ID }}
          private-key: ${{ secrets.RYOPPIPPI_NIX_UPDATER_APP_PRIVATE_KEY }}

      - name: Checkout repository (with bot token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR targets main, so a dispatch from another branch must not
          # carry that branch's commits into it.
          ref: main
          token: ${{ steps.bot.outputs.token }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: '0.114.1'

      # Plugin updates change editor behaviour, so unlike the other bots this
      # PR is never auto-merged: it waits for a manual review of the changes
      # listed in its body.
      - name: Update plugins and open a pull request
        shell: nu {0}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          # ~90 plugin inputs exceed the anonymous GitHub API rate limit
          NIX_CONFIG: access-tokens = github.com=${{ steps.bot.outputs.token }}
          DOTFILES_DIR: ${{ github.workspace }}
        run: |
          const LOCK_DIR = 'nvim/nvimx-lock'
          const BRANCH = 'bot/update-nvim-plugins'

          # nvimx-lock's own record of what moved; kept outside the lock dir so
          # it never shows up as an untracked file there.
          let summary_path = $env.RUNNER_TEMP | path join 'nvimx-summary.json'

          def short [rev] { $rev | default '' | str substring 0..7 }

          # A GitHub compare link for moved plugins, a plain revision otherwise
          def describe [entry: record, change: string] {
            let repo = if ($entry.source.type? == 'github') { $"($entry.source.owner)/($entry.source.repo)" } else { null }
            let name = if $repo != null { $"[`($entry.name)`]\(https://github.com/($repo))" } else { $"`($entry.name)`" }
            match $change {
              'added' => $"| ($name) | added | `(short $entry.to)` |"
              'removed' => $"| ($name) | `(short $entry.from)` | removed |"
              _ if $entry.compareUrl != null => $"| ($name) | `(short $entry.from)` | [`(short $entry.to)`]\(($entry.compareUrl)) |"
              _ => $"| ($name) | `(short $entry.from)` | `(short $entry.to)` |"
            }
          }

          nix run .#nvim-lock -- --update --summary-json $summary_path
          let summary = open $summary_path

          let moved = [
            ...($summary.updated | each {|e| {entry: $e, change: 'updated'} })
            ...($summary.added | each {|e| {entry: $e, change: 'added'} })
            ...($summary.removed | each {|e| {entry: $e, change: 'removed'} })
          ] | sort-by {|m| $m.entry.name }

          if ($moved | is-empty) {
            print 'Every plugin is already at its latest revision.'
            "## Neovim Plugins\n\n:white_check_mark: No plugin moved; the lock is unchanged.\n" | save --append $env.GITHUB_STEP_SUMMARY
            exit 0
          }

          let rows = $moved | each {|m| describe $m.entry $m.change }
          let title = match [($moved | length), ($moved.0.change)] {
            [1, 'removed'] => $"chore\(nvim): drop plugin ($moved.0.entry.name) from the lock"
            [1, _] => $"chore\(nvim): update plugin ($moved.0.entry.name) to (short $moved.0.entry.to)"
            [$n, _] => $"chore\(nvim): update ($n) Neovim plugins"
          }

          let table = ['| Plugin | Old | New |', '|--------|-----|-----|', ...$rows]
          let body = [
            'Automated `nvimx-lock --update` of the Neovim plugins pinned in `nvim/nvimx-lock/`.'
            ''
            '## Changes'
            ''
            ...$table
            ''
            '## Notes'
            '**Not auto-merged.** Review the compare links, then merge and run `nix run .#switch`.'
            'Plugins with `pin = true` in their spec are left untouched.'
            ''
            '---'
            'This PR was automatically created by the Neovim plugin update workflow.'
          ] | str join "\n"

          git add $LOCK_DIR
          git checkout -b $BRANCH
          git commit -m $title
          # The app lacks the `workflows` permission, so moving an existing branch
          # across a workflow change on main is refused; recreating it is not.
          # Deleting the branch closes its stale PR, and a fresh one is opened below.
          if (git ls-remote --heads origin $BRANCH | is-not-empty) {
            git push origin --delete $BRANCH
          }
          git push origin $BRANCH

          match (gh pr list --head $BRANCH --json number | from json | get -o 0.number) {
            null => {
              print $"Creating a pull request for ($BRANCH)"
              gh pr create --title $title --body $body --base main --head $BRANCH --label dependencies --label automated
            }
            $existing => {
              print $"Updating existing PR #($existing)"
              gh pr edit $existing --title $title --body $body
            }
          }

          let url = gh pr view $BRANCH --json url | from json | get url
          ['## Neovim Plugins', '', ...$table, '', $"PR: ($url)", ''] | str join "\n" | save --append $env.GITHUB_STEP_SUMMARY
