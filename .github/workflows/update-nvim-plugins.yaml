name: 'Bot: Update Neovim plugins'

on:
  schedule:
    # An hour after the stable flake update, so the bots do not race for the
    # same checkout.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository (for local actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up git bot identity
        id: bot
        uses: ./.github/actions/setup-git-bot
        with:
          app-id: ${{ secrets.RYOPPIPPI_NIX_UPDATER_APP_ID }}
          private-key: ${{ secrets.RYOPPIPPI_NIX_UPDATER_APP_PRIVATE_KEY }}

      - name: Checkout repository (with bot token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR targets main, so a dispatch from another branch must not
          # carry that branch's commits into it.
          ref: main
          token: ${{ steps.bot.outputs.token }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28
        with:
          version: '0.114.1'

      # Plugin updates change editor behaviour, so unlike the other bots this
      # PR is never auto-merged: it waits for a manual review of the changes
      # listed in its body.
      - name: Update plugins and open a pull request
        shell: nu {0}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          # ~90 plugin inputs exceed the anonymous GitHub API rate limit
          NIX_CONFIG: access-tokens = github.com=${{ steps.bot.outputs.token }}
          DOTFILES_DIR: ${{ github.workspace }}
        run: |
          const LOCK_DIR = 'nvim/nvimx-lock'
          const BRANCH = 'bot/update-nvim-plugins'

          # Re-derives nvimx-lock's own update summary; replace with its
          # machine-readable form once myuron/nvimx#77 lands.
          # plugin name -> locked node of its flake input
          def locked-plugins [] {
            let nodes = open --raw ($LOCK_DIR | path join 'flake.lock') | from json | get nodes
            open ($LOCK_DIR | path join 'plugins.json')
            | get plugins
            | transpose name plugin
            | each {|row| {name: $row.name, locked: ($nodes | get -o $row.plugin.inputName | get -o locked)} }
          }

          def short [rev] { $rev | default '' | str substring 0..7 }

          # A GitHub compare link for moved plugins, a plain revision otherwise
          def describe [name: string, old, new] {
            let o = $old.rev? | default null
            let n = $new.rev? | default null
            let repo = if ($new.type? == 'github') { $"($new.owner)/($new.repo)" } else { null }
            match [$o, $n] {
              [null, _] => $"| `($name)` | added | `(short $n)` |"
              [_, null] => $"| `($name)` | `(short $o)` | removed |"
              _ if $repo != null => $"| [`($name)`]\(https://github.com/($repo)) | `(short $o)` | [`(short $n)`]\(https://github.com/($repo)/compare/($o)...($n)) |"
              _ => $"| `($name)` | `(short $o)` | `(short $n)` |"
            }
          }

          let before = locked-plugins

          nix run .#nvim-lock -- --update

          let after = locked-plugins
          let names = $before | append $after | get name | uniq | sort

          let moved = $names | each {|name|
            let old = $before | where name == $name | get -o 0.locked
            let new = $after | where name == $name | get -o 0.locked
            if ($old.rev? | default null) == ($new.rev? | default null) { null } else { {name: $name, old: $old, new: $new} }
          } | compact

          if ($moved | is-empty) {
            print 'Every plugin is already at its latest revision.'
            "## Neovim Plugins\n\n:white_check_mark: No plugin moved; the lock is unchanged.\n" | save --append $env.GITHUB_STEP_SUMMARY
            exit 0
          }

          let rows = $moved | each {|m| describe $m.name $m.old $m.new }
          let title = match ($moved | length) {
            1 => $"chore\(nvim): update plugin ($moved.0.name) to (short $moved.0.new.rev?)"
            $n => $"chore\(nvim): update ($n) Neovim plugins"
          }

          let table = ['| Plugin | Old | New |', '|--------|-----|-----|', ...$rows]
          let body = [
            'Automated `nvimx-lock --update` of the Neovim plugins pinned in `nvim/nvimx-lock/`.'
            ''
            '## Changes'
            ''
            ...$table
            ''
            '## Notes'
            '**Not auto-merged.** Review the compare links, then merge and run `nix run .#switch`.'
            'Plugins with `pin = true` in their spec are left untouched.'
            ''
            '---'
            'This PR was automatically created by the Neovim plugin update workflow.'
          ] | str join "\n"

          git add $LOCK_DIR
          git checkout -b $BRANCH
          git commit -m $title
          # A re-run reuses the branch name, so the push is forced.
          git push --force origin $BRANCH

          match (gh pr list --head $BRANCH --json number | from json | get -o 0.number) {
            null => {
              print $"Creating a pull request for ($BRANCH)"
              gh pr create --title $title --body $body --base main --head $BRANCH --label dependencies --label automated
            }
            $existing => {
              print $"Updating existing PR #($existing)"
              gh pr edit $existing --title $title --body $body
            }
          }

          let url = gh pr view $BRANCH --json url | from json | get url
          ['## Neovim Plugins', '', ...$table, '', $"PR: ($url)", ''] | str join "\n" | save --append $env.GITHUB_STEP_SUMMARY
